<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>關西味覺大冒險</title>
<meta name="description" content="食帶力量 3D 闖關：跟著關小公仔走遍番茄園、仙草田、紅茶工廠、豆腐店、醬油廠與鹹菜甕，完成六個年級的校訂課程挑戰。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --jar:#241611; --jar-2:#3A2318; --rice:#F7F1E3; --paper:#FBF7EE;
  --crimson:#9E0B22; --peony:#E8447E; --gold:#E8B84B; --leaf:#4E8B2C;
  --ink:#1A100C; --muted:#6B5445; --ok:#2E8B57; --no:#C0392B;
  --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --lv:#E5533F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#BFE3F2;font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* 花布織帶 */
.cloth{height:22px;background-repeat:repeat-x;background-size:65px 22px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='48' viewBox='0 0 140 48'><rect width='140' height='48' fill='%239E0B22'/><g fill='%234E8B2C'><path d='M46 32c8-10 21-12 28-6-8 9-20 12-28 6z'/><path d='M6 4c7-6 18-6 23 0-7 6-17 7-23 0z'/><path d='M86 44c5-7 14-8 19-4-6 6-14 8-19 4z'/></g><g transform='translate(30,24)'><g fill='%23E8447E'><ellipse cx='0' cy='-15' rx='7' ry='10'/><ellipse cx='0' cy='-15' rx='7' ry='10' transform='rotate(60)'/><ellipse cx='0' cy='-15' rx='7' ry='10' transform='rotate(120)'/><ellipse cx='0' cy='-15' rx='7' ry='10' transform='rotate(180)'/><ellipse cx='0' cy='-15' rx='7' ry='10' transform='rotate(240)'/><ellipse cx='0' cy='-15' rx='7' ry='10' transform='rotate(300)'/></g><circle r='5' fill='%23FFF6F0'/></g><g transform='translate(72,34)'><g fill='%23FFF6F0'><ellipse cx='0' cy='-5' rx='3.2' ry='5'/><ellipse cx='0' cy='-5' rx='3.2' ry='5' transform='rotate(72)'/><ellipse cx='0' cy='-5' rx='3.2' ry='5' transform='rotate(144)'/><ellipse cx='0' cy='-5' rx='3.2' ry='5' transform='rotate(216)'/><ellipse cx='0' cy='-5' rx='3.2' ry='5' transform='rotate(288)'/></g><circle r='1.9' fill='%23F58A1F'/></g><g fill='%23D9B8EC'><circle cx='112' cy='22' r='2.7'/><circle cx='119' cy='29' r='2.3'/><circle cx='108' cy='31' r='2.3'/><circle cx='128' cy='26' r='2.5'/></g></svg>")}

/* ── HUD ── */
#hud{position:fixed;left:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hcard{background:rgba(36,22,17,.86);color:var(--rice);border-radius:14px;padding:8px 12px 10px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:auto}
.hname{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.06em}
.hname img{width:34px;height:34px;object-fit:cover;object-position:top;border-radius:50%;background:#F2C14E;border:2px solid var(--gold)}
.hname small{display:block;font-weight:400;font-size:11px;color:#CDBFA8;letter-spacing:.12em}
.badges{display:flex;gap:6px;margin-top:8px}
.bd{width:42px;text-align:center}
.bd b{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-family:var(--serif);
  font-size:13px;line-height:1.05;border:2px dashed rgba(247,241,227,.3);color:rgba(247,241,227,.35)}
.bd.on b{background:var(--c);border:2px solid #fff;color:var(--t,#fff);box-shadow:0 0 0 2px var(--c),0 4px 10px rgba(0,0,0,.35)}
.bd i{display:block;font-style:normal;font-size:9px;letter-spacing:-.5px;color:var(--gold);height:12px;margin-top:2px}
#mini{position:fixed;right:14px;top:14px;z-index:5;width:150px;height:150px;border-radius:50%;
  background:rgba(36,22,17,.85);box-shadow:0 6px 18px rgba(0,0,0,.25);border:3px solid var(--gold)}
#tools{position:fixed;right:14px;top:174px;z-index:5;display:flex;gap:6px;justify-content:flex-end;width:150px}
.tool{width:42px;height:42px;border-radius:50%;border:0;background:rgba(36,22,17,.86);color:var(--rice);font-size:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tool:hover,.tool:focus-visible{background:var(--crimson);outline:none}
#quest{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:5;max-width:min(560px,92vw);
  background:rgba(247,241,227,.94);border:2px solid var(--jar);border-radius:999px;padding:7px 18px;
  font-size:14.5px;font-weight:700;letter-spacing:.04em;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.2);pointer-events:none}
#quest em{font-style:normal;color:var(--crimson)}
#prompt{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;border:0;border-radius:999px;
  padding:13px 26px;font-size:17px;font-weight:900;letter-spacing:.08em;color:var(--jar);background:var(--gold);
  box-shadow:0 5px 0 #A9791B,0 10px 22px rgba(0,0,0,.3);animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
#prompt.lock{background:#D9D1C2;color:#6B5E50;box-shadow:0 5px 0 #A79C8A;animation:none}
#prompt kbd{font-family:inherit;background:var(--jar);color:var(--rice);border-radius:6px;padding:1px 7px;margin-right:6px;font-size:13px}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#joy{position:fixed;left:22px;bottom:26px;z-index:6;width:120px;height:120px;border-radius:50%;
  background:rgba(36,22,17,.25);border:2px solid rgba(255,255,255,.5);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(247,241,227,.9);box-shadow:0 3px 10px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);z-index:20;opacity:0;pointer-events:none;
  background:var(--jar);color:var(--rice);border:2px solid var(--gold);border-radius:16px;padding:12px 22px;
  font-size:17px;font-weight:700;letter-spacing:.06em;transition:opacity .35s,transform .35s;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 開場 ── */
#title{position:fixed;inset:0;z-index:30;display:grid;place-items:safe center;padding:16px;overflow-y:auto;
  background:radial-gradient(80% 70% at 50% 40%,rgba(36,22,17,.35),rgba(36,22,17,.78))}
.tbox{position:relative;width:min(760px,100%);display:grid;grid-template-columns:240px 1fr;gap:10px;align-items:end;
  background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.tbox .cloth{position:absolute;left:0;right:0;top:0}
.tbox .kuan{align-self:end;width:100%;padding:34px 0 0 14px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.tin{padding:42px 28px 26px 10px}
.tin .eye{margin:0;font-size:13px;letter-spacing:.32em;color:var(--crimson);font-weight:700}
.tin h1{margin:6px 0 4px;font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1.08;letter-spacing:.05em}
.tin h1 em{font-style:normal;color:var(--crimson)}
.tin p.lead{margin:8px 0 16px;color:var(--muted);font-size:15px;line-height:1.75}
.field{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.field label{font-weight:700;font-size:14px}
.field input{flex:1;min-width:160px;font:inherit;font-size:17px;padding:10px 14px;border-radius:12px;border:2px solid #D8CBB2;background:#fff;user-select:text}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.field input.short{flex:0 0 72px;min-width:0;width:72px}
.field select{font:inherit;font-size:17px;padding:10px 8px;border-radius:12px;border:2px solid #D8CBB2;background:#fff}
.ferr{margin:-6px 0 12px;color:var(--no);font-weight:700;font-size:14px}
.rec{font-size:13.5px}
.btn{border:0;border-radius:999px;padding:12px 24px;font-size:16px;font-weight:900;letter-spacing:.08em;
  background:var(--jar);color:var(--rice);box-shadow:0 4px 0 #000;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.primary{background:var(--crimson);box-shadow:0 4px 0 #5E0614}
.btn.gold{background:var(--gold);color:var(--jar);box-shadow:0 4px 0 #A9791B}
.btn.ghost{background:transparent;color:var(--jar);box-shadow:inset 0 0 0 2px var(--jar)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.replay{order:-1;margin-right:auto}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.trow{display:flex;gap:10px;flex-wrap:wrap}
.keys{margin:16px 0 0;font-size:12.5px;color:var(--muted);line-height:1.8}
.keys kbd{font-family:inherit;background:#EDE3CF;border-radius:5px;padding:0 6px;font-weight:700;color:var(--ink)}

/* ── 關卡面板 ── */
#panel{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:14px;background:rgba(26,16,12,.55)}
.pbox{position:relative;width:min(860px,100%);max-height:calc(100vh - 28px);display:flex;flex-direction:column;
  background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.phead{display:flex;align-items:center;gap:12px;padding:14px 18px 12px;background:var(--jar);color:var(--rice)}
.phead .gr{background:var(--lv);color:#fff;font-weight:900;font-size:13px;letter-spacing:.18em;padding:5px 11px;border-radius:8px;white-space:nowrap}
.phead h2{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(19px,3vw,25px);letter-spacing:.05em;flex:1;line-height:1.25}
.phead h2 small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:#CDBFA8;letter-spacing:.16em}
.phead .x{border:1px solid rgba(247,241,227,.35);background:transparent;color:var(--rice);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.steps{display:flex;gap:6px;padding:10px 18px;background:#F1E8D6;font-size:12.5px;font-weight:700;color:#A0907A;flex-wrap:wrap}
.steps span{padding:3px 10px;border-radius:999px}
.steps span.on{background:var(--lv);color:#fff}
.steps span.done{color:var(--ok)}
.pbody{padding:18px 20px 20px;overflow:auto;flex:1}
.pfoot{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 18px;flex-wrap:wrap}

.talk{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:end;min-height:200px}
.talk .who-img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid var(--lv);background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.talk.me{grid-template-columns:1fr 130px}
.talk.me .who-img{width:130px;height:auto;border:0;border-radius:0;background:none;box-shadow:none;order:2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.bubble{position:relative;background:#fff;border:3px solid var(--jar);border-radius:18px;padding:14px 18px 16px;min-height:120px;box-shadow:0 6px 0 rgba(36,22,17,.12)}
.bubble .who{display:inline-block;margin:-30px 0 6px -4px;background:var(--jar);color:var(--rice);font-weight:900;font-size:13.5px;letter-spacing:.1em;padding:4px 12px;border-radius:999px}
.talk.me .bubble .who{background:#1F5FD8}
.bubble p{margin:0;font-size:clamp(17px,2.4vw,20px);line-height:1.75;font-weight:500}
.bubble .hk{color:var(--crimson);font-weight:900}

.mission{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.mission .ic{font-size:30px;line-height:1}
.mission h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:.04em}
.mission p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.fb{min-height:52px;margin-top:14px;padding:10px 14px;border-radius:12px;background:#F1E8D6;font-size:15px;line-height:1.6}
.fb.ok{background:#E3F2E1;color:#1E5E34}
.fb.no{background:#FBE4E1;color:#8E2A1E}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* 採番茄 */
.vine{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:18px;border-radius:16px;
  background:linear-gradient(#DCEFC8,#BFDDA0);border:3px solid #7FAF56}
.tomato{position:relative;aspect-ratio:1;border:0;border-radius:50%;max-width:78px;width:100%;justify-self:center;
  box-shadow:inset -6px -8px 0 rgba(0,0,0,.15),inset 6px 6px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.15);transition:transform .2s,opacity .3s}
.tomato::before{content:"";position:absolute;left:50%;top:-6px;width:26px;height:12px;margin-left:-13px;
  background:#2F7A2A;clip-path:polygon(50% 100%,0 20%,30% 45%,50% 0,70% 45%,100% 20%)}
.tomato:hover{transform:scale(1.08) rotate(-4deg)}
.t-r{background:#E23B2E}.t-g{background:#86C24F}.t-o{background:#F39A2B}
.tomato.picked{transform:translateY(-30px) scale(.3);opacity:0;pointer-events:none}
.basket{margin-top:10px;font-weight:900;font-size:16px}
.basket b{color:#E23B2E;font-size:22px}

/* 配對 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:flex;flex-direction:column;gap:9px}
.col h4{margin:0 0 2px;font-size:13px;letter-spacing:.2em;color:var(--muted)}
.mcard{border:3px solid #D8CBB2;background:#fff;border-radius:14px;padding:11px 12px;font-size:18px;font-weight:700;min-height:58px;transition:.15s}
.mcard small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.mcard:hover{border-color:var(--lv)}
.mcard.sel{border-color:var(--lv);background:#F6ECF8;transform:scale(1.03)}
.mcard.done{border-color:var(--ok);background:#E3F2E1;color:#1E5E34;opacity:.75;cursor:default}

/* 排順序 */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;list-style:none;margin:0 0 16px;padding:0}
.slot{min-height:78px;border:3px dashed #D8CBB2;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:6px 4px;background:#fff}
.slot span{font-size:12px;font-weight:900;color:#B8A88E}
.slot.filled{border-style:solid;border-color:var(--lv);background:#FFF8EA;animation:pop .3s}
.slot.filled span{color:var(--lv)}
.slot b{font-size:16px}
.slot small,.ocard small{font-size:11.5px;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ocard{border:3px solid var(--jar);background:#fff;border-radius:14px;padding:10px 18px;font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--jar);display:flex;flex-direction:column;align-items:center}
.ocard:hover{background:#FFF3D6}
.ocard.used{visibility:hidden}

/* 分類 */
.sortcard{min-height:110px;display:grid;place-items:center;text-align:center;padding:18px 22px;border-radius:18px;
  background:#fff;border:3px solid var(--jar);font-size:clamp(17px,2.6vw,21px);font-weight:700;line-height:1.6;box-shadow:0 6px 0 rgba(36,22,17,.15)}
.sortcard.in{animation:pop .3s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.bins.off{opacity:.4;pointer-events:none}
.bin{border:0;border-radius:18px;padding:14px;background:var(--bc);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);font-size:18px}
.bin .ico{display:block;font-size:34px;line-height:1.2}
.bin:active{transform:translateY(3px)}
.prog{height:8px;border-radius:9px;background:#E9DFCB;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--lv);transition:width .4s}

/* 測驗 */
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.qq{margin:6px 0 14px;font-family:var(--serif);font-size:clamp(19px,2.8vw,23px);font-weight:900;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;border:3px solid #D8CBB2;background:#fff;border-radius:14px;padding:12px 14px;font-size:16.5px;font-weight:500;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--lv)}
.opt b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#EFE5D2;margin-right:8px;font-size:13px}
.opt.right{border-color:var(--ok);background:#E3F2E1}
.opt.wrong{border-color:var(--no);background:#FBE4E1}
.opt:disabled{cursor:default}

/* 獎勵 */
.reward{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:center}
.reward img{width:100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.2));animation:jump 1s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-10px)}}
.medal{display:grid;place-items:center;width:130px;height:130px;border-radius:50%;margin:0 0 12px;background:var(--lv);color:var(--mt,#fff);
  font-family:var(--serif);font-weight:900;font-size:34px;border:6px solid #fff;box-shadow:0 0 0 5px var(--gold),0 12px 24px rgba(0,0,0,.25);animation:spin .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes spin{from{transform:rotateY(180deg) scale(.4)}}
.reward h3{margin:0;font-family:var(--serif);font-size:26px;font-weight:900}
.stars{font-size:30px;color:var(--gold);letter-spacing:4px;margin:4px 0}
.stars s{color:#DDD2BE;text-decoration:none}
.reward p{margin:6px 0;color:var(--muted)}
.reward a{color:var(--crimson);font-weight:700}

/* 證書 */
#cert{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:14px;background:rgba(26,16,12,.7)}
.cbox{position:relative;width:min(780px,100%);max-height:calc(100vh - 28px);overflow:auto;background:var(--paper);border-radius:10px;
  padding:0 0 22px;box-shadow:0 30px 70px rgba(0,0,0,.5);text-align:center;border:10px solid var(--crimson)}
.cbox .in{padding:20px 26px 0}
.cbox h2{margin:6px 0 0;font-family:var(--serif);font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:.12em}
.cbox .who{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--crimson);border-bottom:3px solid var(--gold);display:inline-block;padding:0 18px;margin:10px 0 6px}
.cbox .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.cbox .cm{width:86px}
.cbox .cm b{display:grid;place-items:center;width:70px;height:70px;margin:0 auto;border-radius:50%;background:var(--c);color:var(--t,#fff);font-family:var(--serif);font-size:18px;border:3px solid #fff;box-shadow:0 0 0 3px var(--c)}
.cbox .cm.off b{background:#E5DCCB;color:#B4A68E;box-shadow:0 0 0 3px #E5DCCB}
.cbox .cm span{display:block;font-size:12px;margin-top:6px;color:var(--muted)}
.cbox .cm i{font-style:normal;color:var(--gold);font-size:12px}
.cbox .kuan{position:absolute;right:10px;bottom:10px;width:110px;opacity:.95}
.cbox p{margin:6px 0;color:var(--muted)}

@media (max-width:700px){
  .tbox{grid-template-columns:1fr}
  .tbox .kuan{width:150px;justify-self:center;padding:30px 0 0;margin-bottom:-14px}
  .tin{padding:10px 18px 20px}
  .talk{grid-template-columns:90px 1fr}.talk .who-img{width:90px;height:90px}
  .talk.me{grid-template-columns:1fr 80px}.talk.me .who-img{width:80px}
  .vine{grid-template-columns:repeat(4,1fr);padding:12px}
  .track{grid-template-columns:repeat(3,1fr)}
  .opts{grid-template-columns:1fr}
  .reward{grid-template-columns:1fr;text-align:center}.reward img{width:150px;justify-self:center}.medal{margin:0 auto 10px}
  #mini{width:104px;height:104px}

/* ═════════════ 闖關記錄上傳（Google 試算表） ═════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzusBUS3GmH4FCZo96SE7GthHBDwZYFdJF68KzFiOzmo0mLQyX6yawwlT3-afB7zJeYPw/exec';
const recorder = (function(){
  let busy = false;
  async function flush() {
    if (busy || !GAS_URL) return;
    busy = true;
    try {
      let q = lsGet(QUEUE) || [];
      while (q.length) {
        const r = await fetch(GAS_URL, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify(q[0]) });
        const j = await r.json();
        // 資料本身被拒就丟棄，避免卡住後面的記錄；連線問題則留著下次補傳
        if (!j.ok) console.warn('闖關記錄被拒', j.error);
        q = (lsGet(QUEUE) || []).slice(1); lsSet(QUEUE, q);
      }
      return true;
    } catch (e) { return false; }
    finally { busy = false; }
  }
  addEventListener('online', flush);
  return {

let ac = null, muted = false;
function tone(f, d, type, vol, when) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}

const voice = (function(){
  const syn = window.speechSynthesis;
  let picked = null, current = null;
  function pick() {
    if (!syn) return;
    const all = syn.getVoices(), tw = all.filter(v => /zh[-_]TW/i.test(v.lang));
    const pool = tw.length ? tw : all.filter(v => /^zh/i.test(v.lang));
    picked = pool.find(v => /natural|online/i.test(v.name)) || pool[0] || null;
  }
  pick();
  if (syn) syn.addEventListener('voiceschanged', pick);
  const STYLE = { granny:{ pitch:1.15, rate:.88 }, adult:{ pitch:.8, rate:.95 }, teacher:{ pitch:1.1, rate:1 }, kid:{ pitch:1.5, rate:1.05 } };
  return {
    ok: () => !!picked,
    stop() { if (syn) syn.cancel(); current = null; },
    say(html, who) {
      this.stop();
      if (!picked || muted) return;
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      // 括號內的客語拼音不念
      const text = tmp.textContent.replace(/（[^）]*[a-zA-Zˊˇˋ][^）]*）/g, '');
      const u = new SpeechSynthesisUtterance(text), s = STYLE[who] || STYLE.adult;
      u.voice = picked; u.lang = picked.lang; u.pitch = s.pitch; u.rate = s.rate;
      current = u; syn.speak(u); // 保留參考，避免語音播到一半被回收
    }
  };
})();
addEventListener('pagehide', () => voice.stop());

    if (distToPath(x, z) < 4.2) return false;
    for (const s of STA) { const ax = Math.sin(ANG[s.i]) * (R + 8), az = Math.cos(ANG[s.i]) * (R + 8); if (Math.hypot(x - ax, z - az) < 11) return false; }
    if (Math.hypot(x, z - 50) < 13) return false; if (Math.hypot(x + 9, z - 9) < 4) return false;
    return true;
  };
  let n = 0, tries = 0;
  while (n < 120 && tries++ < 3000) {
    const a = rnd() * 6.283, r = 14 + rnd() * 50, x = Math.sin(a) * r, z = Math.cos(a) * r;
    if (!ok(x, z)) continue; n++;
    const t = rnd(), s = .8 + rnd() * .6;
    if (t < .45) { cyl(.22 * s, .3 * s, 1.6 * s, 0x7A5332, x, .8 * s, z); sph(1.3 * s, [0x4E8B2C, 0x5C9A38, 0x3F7A2A][n % 3], x, 2.3 * s, z, null, 8); }
    else if (t < .8) { cyl(.2 * s, .25 * s, 1.2 * s, 0x6A4630, x, .6 * s, z); cone(1.3 * s, 2.4 * s, 0x2F6A3A, x, 2.2 * s, z, null, 7); cone(.95 * s, 1.8 * s, 0x387A42, x, 3.2 * s, z, null, 7); }
    else { for (let k = 0; k < 5; k++) { const h = 3.5 + rnd() * 2.5; const b = cyl(.08, .08, h, 0x7FA84A, x + (rnd() - .5) * 1.2, h / 2, z + (rnd() - .5) * 1.2, null, 5); b.rotation.z = (rnd() - .5) * .2; } }
    colliders.push({ x, z, r:.9 * s });
  }
  const fg = new THREE.SphereGeometry(.13, 5, 4), N = 260;
  const im = new THREE.InstancedMesh(fg, new THREE.MeshLambertMaterial(), N), d = new THREE.Object3D(), col = new THREE.Color();
  const FC = [0xE8447E, 0xFBC2D6, 0xE8B84B, 0xFFF6F0, 0xD9B8EC, 0xF58A1F];
  for (let i = 0; i < N; i++) {
    let x, z; do { const a = rnd() * 6.283, r = 12 + rnd() * 52; x = Math.sin(a) * r; z = Math.cos(a) * r; } while (distToPath(x, z) < 2.2);
    d.position.set(x, .12, z); d.updateMatrix(); im.setMatrixAt(i, d.matrix); im.setColorAt(i, col.setHex(FC[i % FC.length]));
  }
  scene.add(im);
})();

(function(){

    let dx = e.clientX - cx, dy = e.clientY - cy; const l = Math.hypot(dx, dy), m = 44;
    if (l > m) { dx = dx / l * m; dy = dy / l * m; }

    foot([{ t:k === qs.length - 1 ? '看結果 ▶' : '下一題 ▶', id:'qNext', disabled:true, fn:() => { k++; k < qs.length ? render() : finish(); } }]);
    $('#pBody .opts').onclick = e => {

  };
  const finish = () => {

      <div>
        <div class="medal" style="--mt:${lv.text || '#fff'}">${lv.flavor}</div>
        <h3>${first ? '獲得' : '再次挑戰'}「${lv.flavor}」徽章！</h3>
        <div class="stars">${'★'.repeat(score)}<s>${'★'.repeat(3 - score)}</s></div>
        <p>${CN[i]}年級 ${lv.title} 闖關成功${score === 3 ? '，全部答對，太厲害了！' : '。想拿三顆星可以再回來挑戰。'}</p>
        <p>${n < 0 ? '六枚徽章全部收集完成！回到關西國小找老師領取證書吧。' : first && n > i ? `下一站「${CN[n]}年級 ${LEVELS[n].name}」已經解鎖！` : ''}</p>
        <p><a href="${lv.url}" target="_blank" rel="noopener">📖 看完整的${CN[i]}年級課程網 →</a></p>
        ${FREE ? '' : '<p class="rec" id="recMsg">📤 正在送出闖關記錄…</p>'}
      </div></div>`;
  if (!FREE) recorder.add(i, score).then(ok => {
    const m = $('#recMsg'); if (m) m.textContent = ok ? '✅ 闖關記錄已送給老師' : '⏳ 記錄已存好，連上網路後會自動補傳';
  });
  foot([{ t:'回到地圖 ▶', cls:'gold', fn:() => {
    closePanel(); refreshWorld(); burst(STA[i].pos);
    if (first && n >= 0 && n > i) toast(`🔓 解鎖新關卡：${CN[n]}年級 ${LEVELS[n].name}`);
    if (n < 0 && !save.certShown) { save.certShown = true; persist(); setTimeout(openCert, 1200); }
  } }]);
}

/* 帶隊老師 */
function openTeacher() {
  const n = nextIdx(); openUI();
  $('#panel').style.setProperty('--lv', '#E8447E');
  $('#pGrade').textContent = '起點';
  $('#pTitle').innerHTML = '關西國小<small>帶隊老師</small>';
  $('#pSteps').innerHTML = `<span class="on">已收集 ${doneCount()} / 6 枚徽章</span>`;
  const msg = n < 0 ? `太棒了，${save.name || '關小'}！六種關西的味道你都嚐過了。來，這是你的「味覺小達人證書」！`
    : n === 0 ? '番茄、仙草、茶、豆腐、醬油、鹹菜——關西的味道藏在這六個地方。先沿著小路去<b>番茄園</b>找番茄阿伯吧！'
    : `你已經收集 ${doneCount()} 枚徽章了！下一站是<b>${CN[n]}年級 ${LEVELS[n].name}</b>，跟著金色光柱走就對了。`;
  $('#pBody').innerHTML = `<div class="talk"><img class="who-img" src="guansigses2.png" style="object-fit:contain;padding:12px" alt=""><div class="bubble"><span class="who">帶隊老師</span><p>${msg}</p></div></div>`;
  voice.say(msg, 'teacher');
  foot(n < 0 ? [{ t:'領取證書 🏅', cls:'gold', fn:() => { closePanel(); openCert(); } }] : [{ t:'出發！', fn:closePanel }]);
}

/* 證書 */
function openCert() {
  openUI();
  const total = save.stars.reduce((a, b) => a + b, 0), n = doneCount();
  $('#cName').textContent = save.name ? `${clsName(save)} ${save.seat} 號 ${save.name}` : '關小';
  $('#cText').innerHTML = n === 6 ? `走遍番茄園、仙草田、紅茶工廠、豆腐店、醬油廠與鹹菜甕，<br>完成「食帶力量」六大主題闖關，共獲得 <b style="color:var(--crimson)">${total}</b> / 18 顆星。`
    : `目前已收集 ${n} / 6 枚味道徽章，繼續加油！`;
  $('#cRow').innerHTML = LEVELS.map((lv, i) => `<div class="cm ${cleared(i) ? '' : 'off'}" style="--c:${lv.color};--t:${lv.text || '#fff'}"><b>${lv.flavor}</b><span>${CN[i]}年級 ${lv.food}</span><i>${'★'.repeat(save.stars[i])}</i></div>`).join('');
  const d = new Date();
  $('#cDate').textContent = `新竹縣關西國小　${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  $('#cert').classList.remove('hidden');
  if (n === 6) { sfx.win(); burst(kuan.position); }
}
function closeCert() { $('#cert').classList.add('hidden'); uiOpen = false; }
$('#cClose').onclick = closeCert;
$('#cPrint').onclick = () => print();
$('#bCert').onclick = () => { if (!uiOpen) openCert(); };
$('#bHelp').onclick = () => toast('⌨️ W A S D／方向鍵走路<br>🖱 點地面自動走、滾輪拉近拉遠<br>💬 靠近關主按 E／空白鍵，或點下方按鈕', 4500);
$('#bSound').onclick = e => { muted = !muted; if (muted) voice.stop(); e.currentTarget.textContent = muted ? '🔇' : '🔊'; };

/* 開場 */
const readForm = () => ({ grade:$('#gr').value, cls:$('#cl').value.trim(), seat:$('#st').value.trim(), name:$('#nm').value.trim().slice(0, 10) });
function syncStart() {
  const f = readForm(), n = f.grade && f.cls && f.seat && f.name ? loadStudent(f).stars.filter(s => s > 0).length : 0;
  $('#bStart').textContent = n ? `繼續冒險（已有 ${n} 枚徽章）▶` : '開始冒險 ▶';
  $('#bReset').classList.toggle('hidden', !n);
}
if (save.name) { $('#gr').value = save.grade; $('#cl').value = save.cls; $('#st').value = save.seat; $('#nm').value = save.name; }
['#gr', '#cl', '#st', '#nm'].forEach(s => $(s).addEventListener('input', syncStart));
syncStart();
$('#bReset').onclick = () => {
  if (!confirm('確定要清除這位同學的進度，從頭開始嗎？（已送給老師的記錄不會刪除）')) return;
  try { localStorage.removeItem(whoKey(readForm())); } catch (e) {}
  syncStart();
};
$('#bStart').onclick = () => {
  const f = readForm(), err = $('#fErr');
  const bad = !f.grade ? '請選年級' : !(+f.cls >= 1 && +f.cls <= 30) ? '請輸入班級' : !(+f.seat >= 1 && +f.seat <= 60) ? '請輸入座號' : !f.name ? '請輸入姓名' : '';
  if (bad && !FREE) { err.textContent = bad; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  if (!bad) { save = loadStudent(f); lsSet(LAST, f); persist(); }
  sfx.click(); mode = 'play';
  $('#title').classList.add('hidden');
  ['#hud', '#mini', '#tools', '#quest'].forEach(s => $(s).classList.remove('hidden'));
  if (COARSE) $('#joy').classList.remove('hidden');
  refreshWorld(); canvas.focus();
  toast(doneCount() ? `歡迎回來，${save.name || '關小'}！` : `${save.name || '關小'}，先去找門口的帶隊老師聊聊吧！`);
};
$('#nm').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bStart').click(); });

/* ═════════════ 小地圖 ═════════════ */
const mini = $('#mini'), mx = mini.getContext('2d');
function drawMini() {
  const W = 300, S = W / 2 / 66;
  // 小地圖跟著鏡頭轉：畫面「往前」永遠朝上
  const rot = -Math.PI / 2 - Math.atan2(camF.z, camF.x), cr = Math.cos(rot), sr = Math.sin(rot);
  const M = (x, z) => [150 + (x * cr - z * sr) * S, 150 + (x * sr + z * cr) * S];
  mx.clearRect(0, 0, W, W);
  mx.save(); mx.beginPath(); mx.arc(150, 150, 150, 0, 7); mx.clip();
  mx.fillStyle = '#7FB257'; mx.fillRect(0, 0, W, W);
  mx.fillStyle = '#5AA8C8'; mx.beginPath(); mx.arc(150, 150, 10 * S, 0, 7); mx.fill();
  mx.strokeStyle = '#EAD7A8'; mx.lineWidth = 7; mx.beginPath();
  PATH.forEach((p, i) => { const [x, y] = M(p.x, p.z); i ? mx.lineTo(x, y) : mx.moveTo(x, y); }); mx.stroke();
  const [sx, sy] = M(0, 53); mx.fillStyle = '#9E0B22'; mx.beginPath(); mx.arc(sx, sy, 11, 0, 7); mx.fill();
  mx.fillStyle = '#fff'; mx.font = '900 13px ' + FONT; mx.textAlign = 'center'; mx.textBaseline = 'middle'; mx.fillText('校', sx, sy + 1);
  const nx = nextIdx();
  STA.forEach(s => {
    const [x, y] = M(s.pos.x, s.pos.z);
    mx.beginPath(); mx.arc(x, y, s.i === nx ? 17 : 14, 0, 7);
    mx.fillStyle = unlocked(s.i) ? s.lv.color : '#8A8075'; mx.fill();
    mx.lineWidth = s.i === nx ? 5 : 3; mx.strokeStyle = s.i === nx ? '#FFE07A' : '#fff'; mx.stroke();
    mx.fillStyle = '#fff'; mx.font = '900 18px ' + FONT; mx.textAlign = 'center'; mx.textBaseline = 'middle';
    mx.fillText(cleared(s.i) ? '✓' : s.i + 1, x, y + 1);
  });
  const [px, py] = M(kuan.position.x, kuan.position.z), a = kuan.rotation.y;
  mx.translate(px, py); mx.rotate(rot - a);
  mx.fillStyle = '#F28A1E'; mx.strokeStyle = '#fff'; mx.lineWidth = 3;
  mx.beginPath(); mx.moveTo(0, 13); mx.lineTo(9, -8); mx.lineTo(0, -3); mx.lineTo(-9, -8); mx.closePath(); mx.fill(); mx.stroke();
  mx.restore();
}

/* ═════════════ 主迴圈 ═════════════ */
const clock = new THREE.Clock();
let walkPhase = 0, tAll = 0;
const camPos = new THREE.Vector3(0, 40, 90), camF = new THREE.Vector3(0, 0, 1), camWant = new THREE.Vector3(0, 0, 1);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function animateFigure(f, moving, phase, t) {
  const u = f.userData, sw = moving ? Math.sin(phase) * .7 : 0;
  u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
  u.arms[0].rotation.x = -sw * .9; u.arms[1].rotation.x = sw * .9;
  u.arms[0].rotation.z = 0; u.arms[1].rotation.z = 0;
  f.position.y = moving ? Math.abs(Math.sin(phase)) * .12 : Math.sin(t * 2.2) * .02;
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05); tAll += dt;

  // 移動
  let ix = 0, iz = 0;
  if (mode === 'play' && !uiOpen) {
    if (keys.w || keys.arrowup) iz -= 1; if (keys.s || keys.arrowdown) iz += 1;
    if (keys.a || keys.arrowleft) ix -= 1; if (keys.d || keys.arrowright) ix += 1;
    ix += joyV.x; iz += joyV.z;
    if (ix || iz) { target = null; marker.visible = false; }
    else if (target) {
      const dx = target.x - kuan.position.x, dz = target.z - kuan.position.z, d = Math.hypot(dx, dz);
      if (d < .35) { target = null; marker.visible = false; } else { ix = dx / d; iz = dz / d; }
    }
  }
  // 鏡頭永遠從地圖中心往外看：鍵盤與搖桿方向跟著鏡頭轉
  const pr0 = Math.hypot(kuan.position.x, kuan.position.z);
  if (pr0 > 1) camWant.set(kuan.position.x / pr0, 0, kuan.position.z / pr0);
  camF.lerp(camWant, 1 - Math.exp(-dt * 2.5)).normalize();
  if (!target && (ix || iz)) {
    const fx = camF.x, fz = camF.z, rx = -fz, rz = fx;
    const mx2 = fx * -iz + rx * ix, mz2 = fz * -iz + rz * ix;
    ix = mx2; iz = mz2;
  }
  const len = Math.hypot(ix, iz), moving = len > .05;
  if (moving) {
    const sp = 8.5 * Math.min(1, len);
    ix /= len; iz /= len;
    const p = kuan.position;
    p.x += ix * sp * dt; p.z += iz * sp * dt;
    for (const c of colliders) {
      const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + .5;
      if (d < m && d > 0) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
    }
    const r = Math.hypot(p.x, p.z); if (r > 62) { p.x *= 62 / r; p.z *= 62 / r; }
    const want = Math.atan2(ix, iz); let da = want - kuan.rotation.y;
    da = Math.atan2(Math.sin(da), Math.cos(da)); kuan.rotation.y += da * Math.min(1, dt * 12);
    walkPhase += dt * sp * 1.25;
  }
  animateFigure(kuan, moving, walkPhase, tAll);
  if (!moving && mode === 'title') { const u = kuan.userData; u.arms[1].rotation.z = 2.6 + Math.sin(tAll * 6) * .3; }
  blob.position.set(kuan.position.x, .07, kuan.position.z);
  if (marker.visible) { marker.scale.setScalar(1 + Math.sin(tAll * 6) * .15); }

  // 關主
  near = null; let best = 3.8;
  STA.forEach(s => {
    const n = s.npc, d = kuan.position.distanceTo(s.pos);
    const dn = Math.hypot(kuan.position.x - n.position.x, kuan.position.z - n.position.z);
    if (Math.min(d, dn) < best) { best = Math.min(d, dn); near = s; }
    n.position.y = Math.sin(tAll * 2 + s.i) * .03;
    const u = n.userData;
    if (dn < 8) u.head.rotation.y += (THREE.MathUtils.clamp(Math.atan2(kuan.position.x - n.position.x, kuan.position.z - n.position.z) - n.rotation.y, -1, 1) - u.head.rotation.y) * .1;
    u.arms[1].rotation.z = near === s ? 2.5 + Math.sin(tAll * 7) * .35 : 0;
    s.icon.position.y = 3.4 + Math.sin(tAll * 3 + s.i) * .12;
    s.pad.rotation.y += dt * .4;
    s.flag.children[1].rotation.y = Math.sin(tAll * 3) * .25;
  });
  if (Math.hypot(kuan.position.x - teacher.position.x, kuan.position.z - teacher.position.z) < 3.2) near = 'teacher';
  tIcon.position.y = 3.2 + Math.sin(tAll * 3) * .12;
  teacher.userData.arms[1].rotation.z = near === 'teacher' ? 2.5 + Math.sin(tAll * 7) * .35 : 0;

  // 提示按鈕
  const pr = $('#prompt');
  if (mode === 'play' && !uiOpen && near) {
    const lock = near !== 'teacher' && !unlocked(near.i);
    const who = near === 'teacher' ? '帶隊老師' : near.lv.npc;
    const html = lock ? `🔒 ${CN[near.i]}年級關卡尚未解鎖` : `<kbd>E</kbd>和「${who}」說話`;
    if (pr.dataset.h !== html) { pr.innerHTML = html; pr.dataset.h = html; }
    pr.classList.toggle('lock', lock); pr.classList.remove('hidden');
  } else pr.classList.add('hidden');

  // 導引
  const nx = nextIdx(), tgt = nx < 0 ? teacher.position : STA[nx].pos;
  beam.material.opacity = .16 + Math.sin(tAll * 3) * .07;
  beam.scale.x = beam.scale.z = 1 + Math.sin(tAll * 3) * .08;
  const dTo = Math.hypot(tgt.x - kuan.position.x, tgt.z - kuan.position.z);
  arrow.visible = mode === 'play' && !uiOpen && dTo > 5;
  arrow.position.set(kuan.position.x, 0, kuan.position.z);
  arrow.rotation.y = Math.atan2(tgt.x - kuan.position.x, tgt.z - kuan.position.z);
  ah.position.z = 2.1 + Math.sin(tAll * 5) * .2;

  // 場景動畫
  puffs.forEach(p => { const u = p.userData; u.t = (u.t + dt * .35) % 1; p.position.set(u.s.x + Math.sin(u.t * 9 + p.id) * .3, u.s.y + .2 + u.t * 3, u.s.z); p.scale.setScalar(.6 + u.t * 1.6); p.material.opacity = (1 - u.t) * .7; });
  if (anim.mill) anim.mill.rotation.y += dt * 1.2;
  clouds.forEach((c, i) => { c.position.x += dt * (.8 + i * .1); if (c.position.x > 110) c.position.x = -110; });
  for (let k = confetti.length - 1; k >= 0; k--) {
    const c = confetti[k], u = c.userData;
    u.v.y -= 14 * dt; c.position.addScaledVector(u.v, dt); c.rotation.x += dt * 6; c.rotation.y += dt * 4;
    u.life -= dt; if (u.life <= 0 || c.position.y < 0) { scene.remove(c); c.geometry.dispose(); c.material.dispose(); confetti.splice(k, 1); }
  }

  // 鏡頭
  if (mode === 'title') {
    const a = tAll * .08;
    camPos.set(Math.sin(a) * 70, 42, Math.cos(a) * 70);
    camera.position.lerp(camPos, .05); camera.lookAt(0, 0, 0);
  } else {
    const k = camDist * (innerWidth < innerHeight ? 1.25 : 1);
    camPos.set(kuan.position.x - camF.x * k, k * .62, kuan.position.z - camF.z * k);
    camera.position.lerp(camPos, 1 - Math.exp(-dt * 5));
    camera.lookAt(kuan.position.x + camF.x * 3, 1.6, kuan.position.z + camF.z * 3);
  }
  if (mode === 'play') drawMini();
  renderer.render(scene, camera);
}

if (/[?&]debug=1/.test(location.search)) window.__quest = { openLevel, openCert, kuan, save:() => save };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(refreshWorld);
refreshWorld();
tick();
})();
</script>
